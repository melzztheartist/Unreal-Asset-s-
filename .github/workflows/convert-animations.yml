name: Convert Unreal animations to readable JSON

# What this does
#   1. finds every .uasset in the repo (and inside any .zip in the repo, e.g. Assets.zip),
#   2. fetches the real files from Git LFS if they are only 131-byte pointer stubs (fill in lfs_repo with the repository they came from),
#   3. reads them with UAssetAPI and writes one readable <name>.anim.json per animation (bone tracks, fps, length, root-motion flags),
#   4. uploads everything as the artifact "converted-animations" (Actions -> this run -> Artifacts at the bottom)
#      and, if you tick "commit_results", also commits it to a converted/ folder.
# Run it: Actions tab -> "Convert Unreal animations to readable JSON" -> Run workflow.
# Save this file as .github/workflows/convert-animations.yml in the repository that holds the real Assets.

on:
  workflow_dispatch:
    inputs:
      bones:
        description: "Bones to keep: core (about 35 bones, small files) or all (every bone, fingers and twist bones too)"
        type: choice
        options: [core, all]
        default: core
      engine_versions:
        description: "Unreal versions to try in this order (the first one that reads the file is used; the animations are UE 5.4)"
        type: string
        default: "VER_UE5_4,VER_UE5_5,VER_UE5_3,VER_UE5_6,VER_UE5_2,VER_UE5_1,VER_UE5_0,VER_UE5_7"
      lfs_repo:
        description: "Optional: the GitHub repository (owner/name) the Assets.zip was downloaded from, so its real files can be fetched from Git LFS"
        type: string
        default: ""
      limit:
        description: "Test run: only convert the first N files (0 = all). Try 3 first."
        type: string
        default: "0"
      commit_results:
        description: "Also commit the converted files to a converted/ folder in the repository"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out (with Git LFS files)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build the UAssetAPI reader
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/atenfyr/UAssetAPI.git "$RUNNER_TEMP/UAssetAPI"
          CSPROJ="$(find "$RUNNER_TEMP/UAssetAPI" -name UAssetAPI.csproj | head -1)"
          TFM="$(grep -oE 'net[0-9]+\.0' "$CSPROJ" | sort -V | tail -1 || true)"
          TFM="${TFM:-net8.0}"
          echo "UAssetAPI project: $CSPROJ  (target $TFM)"
          mkdir -p "$RUNNER_TEMP/animdump"
          cd "$RUNNER_TEMP/animdump"
          cat > AnimDump.csproj <<CSPROJEOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>$TFM</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <AssemblyName>AnimDump</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$CSPROJ" />
            </ItemGroup>
          </Project>
          CSPROJEOF
          cat > Program.cs <<'CSEOF'
          using System.Reflection;
          using UAssetAPI;
          using UAssetAPI.UnrealTypes;

          // usage: AnimDump <EngineVersion> <in.uasset> <out.json>   (writes the whole asset as UAssetAPI JSON)
          if (args.Length < 3) { Console.Error.WriteLine("usage: AnimDump <EngineVersion> <in.uasset> <out.json>"); return 2; }
          if (!Enum.TryParse<EngineVersion>(args[0], out var ver)) { Console.Error.WriteLine("unknown engine version " + args[0]); return 3; }
          try
          {
              var asset = new UAsset(args[1], ver);
              MethodInfo m = typeof(UAsset).GetMethods().First(x => x.Name == "SerializeJson" && x.ReturnType == typeof(string) && x.GetParameters().All(p => p.IsOptional));
              object[] a = m.GetParameters().Select(p => p.HasDefaultValue ? p.DefaultValue : Type.Missing).ToArray();
              File.WriteAllText(args[2], (string)m.Invoke(asset, a));
              return 0;
          }
          catch (Exception e)
          {
              Console.Error.WriteLine(e.GetType().Name + ": " + e.Message);
              return 1;
          }
          CSEOF
          dotnet publish -c Release -o "$RUNNER_TEMP/animdump/bin" 2>&1 | tail -25
          ls "$RUNNER_TEMP/animdump/bin/AnimDump.dll"

      - name: Find the .uasset files (unzip Assets.zip, resolve LFS pointers)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LFS_REPOS: ${{ inputs.lfs_repo }}
        run: |
          cat > "$RUNNER_TEMP/collect.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Find every .uasset (in the repo and inside any zip), turn Git LFS pointer files into real files, write work/files.txt."""
          import base64, json, os, re, subprocess, sys, urllib.request, zipfile

          ROOT = os.getcwd()
          WORK = os.path.join(ROOT, "work")
          SKIP = (".git", "work", "out", "tools", "node_modules")
          POINTER = re.compile(rb"^version https://git-lfs\.github\.com/spec/v1\s+oid sha256:([0-9a-f]{64})\s+size (\d+)", re.S)


          def pointer_info(path):
              try:
                  with open(path, "rb") as f:
                      head = f.read(300)
              except OSError:
                  return None
              m = POINTER.match(head)
              return (m.group(1).decode(), int(m.group(2))) if m else None


          def unzip_all():
              n = 0
              for dp, dn, fn in os.walk(ROOT):
                  dn[:] = [d for d in dn if d not in SKIP]
                  for f in fn:
                      if f.lower().endswith(".zip"):
                          dest = os.path.join(WORK, "zip", os.path.splitext(f)[0])
                          print("unzipping", os.path.join(dp, f))
                          try:
                              with zipfile.ZipFile(os.path.join(dp, f)) as z:
                                  z.extractall(dest)
                                  n += 1
                          except zipfile.BadZipFile:
                              print("  not a readable zip (is it an LFS pointer?)")
              return n


          def gather():
              found = {}  # rel -> (abs, pointer or None)  (a real file beats a pointer)
              roots = [(ROOT, SKIP)]
              zdir = os.path.join(WORK, "zip")
              if os.path.isdir(zdir):
                  for d in sorted(os.listdir(zdir)):
                      roots.append((os.path.join(zdir, d), ()))
              for base, skip in roots:
                  for dp, dn, fn in os.walk(base):
                      if base == ROOT:
                          dn[:] = [d for d in dn if d not in skip]
                      for f in fn:
                          if not f.lower().endswith(".uasset"):
                              continue
                          ap = os.path.join(dp, f)
                          rel = os.path.relpath(ap, base).replace(os.sep, "/")
                          ptr = pointer_info(ap)
                          if rel not in found or (found[rel][1] and not ptr):
                              found[rel] = (ap, ptr)
              return found


          def norm_repo(r):
              r = r.strip().rstrip("/")
              r = re.sub(r"^https?://[^/]+/", "", r)
              return r[:-4] if r.endswith(".git") else r


          def fetch_from(repo, items, token, server):
              """Download LFS objects for items {rel: (abs, (oid,size))} from one repository's LFS store."""
              import hashlib
              url = f"{server}/{repo}.git/info/lfs/objects/batch"
              hdr = {"Accept": "application/vnd.git-lfs+json", "Content-Type": "application/vnd.git-lfs+json"}
              if token:
                  hdr["Authorization"] = "Basic " + base64.b64encode(f"x-access-token:{token}".encode()).decode()
              got, lst = {}, list(items.items())
              for i in range(0, len(lst), 50):
                  chunk = lst[i:i + 50]
                  body = {"operation": "download", "transfers": ["basic"], "objects": [{"oid": p[1][0], "size": p[1][1]} for _, p in chunk]}
                  try:
                      req = urllib.request.Request(url, data=json.dumps(body).encode(), method="POST", headers=hdr)
                      resp = json.load(urllib.request.urlopen(req, timeout=60))
                  except Exception as e:
                      print(f"  {repo}: LFS request failed ({e})")
                      return got
                  by_oid = {o["oid"]: o for o in resp.get("objects", [])}
                  for rel, (ap, (oid, size)) in chunk:
                      act = by_oid.get(oid, {}).get("actions", {}).get("download")
                      if not act:
                          continue
                      try:
                          data = urllib.request.urlopen(urllib.request.Request(act["href"], headers=act.get("header", {})), timeout=180).read()
                      except Exception as e:
                          print("  download failed for", rel, e)
                          continue
                      if len(data) != size or hashlib.sha256(data).hexdigest() != oid:
                          print("  checksum mismatch for", rel)
                          continue
                      dest = os.path.join(WORK, "lfs", rel)
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      with open(dest, "wb") as f:
                          f.write(data)
                      got[rel] = dest
              print(f"  {repo}: got {len(got)} of {len(items)}")
              return got


          def lfs_download(pointers):
              """Tries the repositories listed in LFS_REPOS first (the repo the assets originally came from), then this repository
              (its LFS store is shared with its forks). Public repositories can be read without a login."""
              token = os.environ.get("GITHUB_TOKEN", "")
              server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
              own = os.environ.get("GITHUB_REPOSITORY", "")
              repos = [norm_repo(r) for r in os.environ.get("LFS_REPOS", "").replace(";", ",").split(",") if r.strip()]
              if own:
                  repos.append(own)
              got, left = {}, dict(pointers)
              for repo in repos:
                  if not left:
                      break
                  got.update(fetch_from(repo, left, token if repo == own else "", server))
                  left = {k: v for k, v in left.items() if k not in got}
              return got


          def main():
              os.makedirs(WORK, exist_ok=True)
              unzip_all()
              found = gather()
              print("found", len(found), ".uasset files")
              ptrs = {rel: (ap, p) for rel, (ap, p) in found.items() if p}
              resolved = {}
              if ptrs:
                  print(len(ptrs), "of them are Git LFS pointers (131-byte stubs); trying to fetch the real files from Git LFS")
                  resolved = lfs_download(ptrs)
                  print("fetched", len(resolved), "of", len(ptrs))
              lines = []
              for rel, (ap, p) in sorted(found.items()):
                  if p:
                      if rel in resolved:
                          lines.append(f"{resolved[rel]}|{rel}")
                  else:
                      lines.append(f"{ap}|{rel}")
              with open(os.path.join(WORK, "files.txt"), "w") as f:
                  f.write("\n".join(lines))
              missing = len(found) - len(lines)
              print("usable files:", len(lines), " unusable pointers:", missing)
              if not lines:
                  print("::error::No real .uasset files found. The files in this repository / zip are Git LFS pointers and the LFS objects could not be fetched. "
                        "Run the workflow again with the 'lfs_repo' box set to the GitHub repository the Assets.zip came from (owner/name), or fork that repository, or commit the real .uasset files.")
                  sys.exit(1)
              if missing:
                  print(f"::warning::{missing} .uasset files were only LFS pointers and were skipped.")


          main()
          PYEOF
          python3 -u "$RUNNER_TEMP/collect.py"

      - name: Convert
        timeout-minutes: 90
        run: |
          cat > "$RUNNER_TEMP/convert.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Parse each .uasset with UAssetAPI (AnimDump.dll), pull out the raw bone tracks, write one readable .anim.json per animation."""
          import base64, json, os, struct, subprocess, sys, time, traceback

          sys.stdout.reconfigure(line_buffering=True)
          DLL, VERSIONS, BONES = sys.argv[1], sys.argv[2].split(","), sys.argv[3]
          LIMIT = int(sys.argv[4]) if len(sys.argv) > 4 and sys.argv[4].strip().isdigit() else 0
          TOOL_TIMEOUT = 90          # seconds for one read attempt of one file
          WORK, OUT, DEBUG = "work", "out", "out/debug"
          CORE = {"root", "pelvis", "spine_01", "spine_02", "spine_03", "spine_04", "spine_05", "neck_01", "neck_02", "head",
                  "clavicle_l", "upperarm_l", "lowerarm_l", "hand_l", "clavicle_r", "upperarm_r", "lowerarm_r", "hand_r",
                  "thigh_l", "calf_l", "foot_l", "ball_l", "thigh_r", "calf_r", "foot_r", "ball_r",
                  "ik_foot_root", "ik_foot_l", "ik_foot_r", "ik_hand_root", "ik_hand_gun", "ik_hand_l", "ik_hand_r", "interaction", "center_of_mass"}
          # UE5 mannequin (Manny / Quinn) hierarchy of the core bones, for whoever reads the files.
          PARENT = {"root": None, "pelvis": "root", "spine_01": "pelvis", "spine_02": "spine_01", "spine_03": "spine_02", "spine_04": "spine_03",
                    "spine_05": "spine_04", "neck_01": "spine_05", "neck_02": "neck_01", "head": "neck_02",
                    "clavicle_l": "spine_05", "upperarm_l": "clavicle_l", "lowerarm_l": "upperarm_l", "hand_l": "lowerarm_l",
                    "clavicle_r": "spine_05", "upperarm_r": "clavicle_r", "lowerarm_r": "upperarm_r", "hand_r": "lowerarm_r",
                    "thigh_l": "pelvis", "calf_l": "thigh_l", "foot_l": "calf_l", "ball_l": "foot_l",
                    "thigh_r": "pelvis", "calf_r": "thigh_r", "foot_r": "calf_r", "ball_r": "foot_r",
                    "ik_foot_root": "root", "ik_foot_l": "ik_foot_root", "ik_foot_r": "ik_foot_root", "ik_hand_root": "root",
                    "ik_hand_gun": "ik_hand_root", "ik_hand_l": "ik_hand_gun", "ik_hand_r": "ik_hand_gun", "interaction": "root", "center_of_mass": "root"}
          META = ["AdditiveAnimType", "RefPoseType", "bEnableRootMotion", "RootMotionRootLock", "bForceRootLock", "RateScale", "Interpolation"]


          WANT = set(["BoneAnimationTracks", "RawAnimationData", "AnimationTrackNames", "NumberOfFrames", "NumberOfKeys", "FrameRate"] + META)


          def scan(root):
              """one pass over the (huge) JSON; stops descending at the properties we want -> {name: [property, ...]}"""
              found, st = {}, [root]
              while st:
                  c = st.pop()
                  if isinstance(c, dict):
                      nm = c.get("Name")
                      if nm in WANT and "Value" in c:
                          found.setdefault(nm, []).append(c)
                          continue
                      st.extend(v for v in c.values() if isinstance(v, (dict, list)))
                  elif isinstance(c, list):
                      st.extend(x for x in c if isinstance(x, (dict, list)))
              return found


          def kids(prop):
              v = prop.get("Value")
              if isinstance(v, list):
                  return {c.get("Name"): c for c in v if isinstance(c, dict) and "Name" in c}
              return {}


          def val(p):
              v = p.get("Value") if isinstance(p, dict) else p
              while isinstance(v, dict) and "Value" in v and not ("X" in v):
                  v = v["Value"]
              return v


          def as_name(p):
              v = val(p)
              if isinstance(v, dict):
                  v = v.get("Value", v.get("Name", ""))
              return str(v)


          def nums(x, width):
              """One key (Vector / Quat) in any shape UAssetAPI might give it -> list of floats."""
              if isinstance(x, dict):
                  if "X" in x and "Y" in x:
                      r = [x["X"], x["Y"], x.get("Z", 0.0)] + ([x.get("W", 1.0)] if width == 4 else [])
                      return [float(v) for v in r[:width]]
                  if "Value" in x:
                      return nums(x["Value"], width)
              if isinstance(x, list):
                  if x and isinstance(x[0], dict) and "Name" in x[0]:
                      m = {c["Name"]: val(c) for c in x}
                      if "X" in m:
                          return nums(m, width)
                  if x and all(isinstance(v, (int, float)) for v in x):
                      return [float(v) for v in x[:width]]
              raise ValueError("unknown key shape: " + repr(x)[:120])


          def bytes_of(v):
              if isinstance(v, str):
                  return base64.b64decode(v)
              if isinstance(v, list) and all(isinstance(b, int) for b in v):
                  return bytes(b & 255 for b in v)
              return None


          def decode_binary(b):
              """FRawAnimSequenceTrack saved natively: int32 count + FVector3f[] , int32 count + FQuat4f[] , int32 count + FVector3f[]."""
              i, out = 0, []
              for w in (3, 4, 3):
                  (c,) = struct.unpack_from("<i", b, i)
                  i += 4
                  if c < 0 or i + c * w * 4 > len(b):
                      raise ValueError("bad raw track")
                  out.append([list(struct.unpack_from("<" + "f" * w, b, i + k * w * 4)) for k in range(c)])
                  i += c * w * 4
              return out


          def keys(prop, width):
              v = val(prop) if prop is not None else []
              return [nums(e, width) for e in v] if isinstance(v, list) else []


          def track_of(itd):
              """itd = the InternalTrackData / RawAnimSequenceTrack property (or the element itself) -> (pos, rot, scale)."""
              b = bytes_of(val(itd))
              if b is not None:
                  return decode_binary(b)
              k = kids(itd)
              return keys(k.get("PosKeys"), 3), keys(k.get("RotKeys"), 4), keys(k.get("ScaleKeys"), 3)


          def extract(doc):
              """-> (tracks={bone:(pos,rot,scl)}, info, meta)"""
              f = scan(doc)
              tracks, info = {}, {}
              for arr in f.get("BoneAnimationTracks", []):            # UE 5 (AnimDataModel)
                  for el in val(arr) or []:
                      k = kids(el)
                      if "Name" in k and "InternalTrackData" in k:
                          tracks[as_name(k["Name"])] = track_of(k["InternalTrackData"])
              if not tracks and f.get("RawAnimationData") and f.get("AnimationTrackNames"):   # UE 4 / early UE 5
                  for n, t in zip(val(f["AnimationTrackNames"][0]), val(f["RawAnimationData"][0])):
                      tracks[as_name(n)] = track_of(t)
              for key in ("NumberOfFrames", "NumberOfKeys"):
                  if key in f:
                      try:
                          info[key] = int(val(f[key][0]))
                      except (TypeError, ValueError):
                          pass
              for p in f.get("FrameRate", []):
             
